{% extends "base.html" %}{% block heading %}{% if kind=='IN' %}Add Stock{% else %}Remove Stock{% endif %}{% endblock %}{% block content %}
<section class="panel narrow"><h2>{% if kind=='IN' %}Record Incoming Stock{% else %}Record Outgoing Stock{% endif %}</h2><form method="post" class="stack"><label>Product<select name="product_id" required>{% for p in products %}<option value="{{ p.product_id }}">{{ p.product_name }} (Available: {{ p.current_stock }})</option>{% endfor %}</select></label><label>Quantity<input type="number" name="quantity" min="1" required></label>{% if kind=='IN' %}<label>Supplier (optional)<select name="supplier_id"><option value="">Select supplier</option>{% for s in suppliers %}<option value="{{ s.supplier_id }}">{{ s.supplier_name }}</option>{% endfor %}</select></label>{% endif %}<button class="button">{% if kind=='IN' %}Add Stock{% else %}Remove Stock{% endif %}</button></form></section>{% endblock %}
